[package]
name = "coin-cli"
version = "0.0.1"
edition = "2024"
description = "A CLI for your Coinbase account"
license = "MIT"
repository = "https://github.com/HighDesertCode/coin-cli"
include = ["src/**", "Cargo.toml", "README.md", "LICENSE"]

[[bin]]
name = "coin"
path = "src/main.rs"

[dependencies]
anyhow = "1"
base64 = "0.23.1"
clap = { version = "4.6.7", features = ["derive"] }
ed25519-dalek = { version = "2", features = ["pkcs8"] }
jsonwebtoken = { version = "11.1.0", features = ["rust_crypto"] }
reqwest = { version = "0.13", features = ["json", "blocking"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1.0.154"

[lints.clippy]
# Opinionated style and idiom lints
pedantic = { level = "warn", priority = -1 }

# Anything that can panic at runtime: prefer `?` and proper errors
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
unreachable = "warn"

# Unfinished or leftover code
todo = "warn"
unimplemented = "warn"
dbg_macro = "warn"

# Errors should be returned (anyhow prints them), not printed by hand
print_stderr = "warn"

