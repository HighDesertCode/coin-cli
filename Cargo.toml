[package]
name = "coin-cli"
version = "0.0.1"
edition = "2024"
description = "A CLI for your Coinbase account"
license = "MIT"
repository = "https://github.com/HighDesertCode/coin-cli"
include = ["src/**", "Cargo.toml", "README.md", "LICENSE"]

[[bin]]
name = "coin"
path = "src/main.rs"

[dependencies]
anyhow = "1"
base64 = "0.23.1"
ed25519-dalek = { version = "2", features = ["pkcs8"] }
jsonwebtoken = { version = "11.1.0", features = ["rust_crypto"] }
reqwest = { version = "0.13", features = ["json", "blocking"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1.0.154"
